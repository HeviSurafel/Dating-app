name: dating_app
description: Modern Dating App - Find Your Perfect Match
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.1.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.1
  logger: ^2.0.1

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentication
  firebase_core: ^2.24.2
  firebase_messaging: ^14.6.7
  google_sign_in: ^6.1.5
  # UI Components
  swipe_cards: ^1.0.0
  flutter_chat_ui: ^1.6.12
  photo_view: ^0.14.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator:
  pin_code_fields:
  # Location
  geolocator:
  geocoding:

  # Forms & Validation
  flutter_form_builder:
  form_builder_validators:

  # Utilities
  intl:
  url_launcher:
  flutter_local_notifications:
  permission_handler:
  image_picker:
  flutter_dotenv:
  # Animations
  animations:
  lottie:
  location: ^5.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^7.0.8
  hive_generator: ^2.0.1

# Flutter specific configuration
flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
#    - assets/images/
#    - assets/icons/
#    - assets/fonts/
#    - assets/animations/
#    - assets/translations/
#    - assets/config/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
